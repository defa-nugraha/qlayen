name: Temporary format repair

on:
  push:
    branches:
      - feature/public-sticky-header-logo-management

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Format changed PHP and frontend files
        run: |
          composer lint
          npm run check -- --fix
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/BrandAssetController.php resources/js/components/app-logo.tsx resources/js/components/app-sidebar.tsx resources/js/layouts/auth/auth-simple-layout.tsx resources/js/pages/brand-assets/index.tsx resources/js/pages/welcome.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format brand asset changes"
            git push origin HEAD:feature/public-sticky-header-logo-management
          fi
