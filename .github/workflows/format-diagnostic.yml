name: Temporary formatter diagnostic

on:
  push:
    branches:
      - 'fix/ci-format-diagnostic'

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply project formatter to customer page
        run: npm run check:fix
      - name: Print formatted customer page
        if: always()
        run: |
          echo "FORMATTER_DIFF_BEGIN"
          git diff -- resources/js/pages/customers/index.tsx
          echo "FORMATTER_DIFF_END"
          echo "FORMATTER_FILE_BASE64_BEGIN"
          base64 -w0 resources/js/pages/customers/index.tsx
          echo
          echo "FORMATTER_FILE_BASE64_END"
