name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

# Keep only the newest run for a branch; superseded commits should not occupy runners.
concurrency:
  group: qlayen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          # Laravel 13 and the committed lock file require PHP 8.4.1+.
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        id: php-deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        id: frontend-deps
        run: npm ci

      # Run every quality gate even if another check fails, so one CI run
      # reveals all current issues instead of hiding them behind the first failure.
      - name: Check PHP formatting
        if: ${{ !cancelled() && steps.php-deps.outcome == 'success' }}
        run: composer lint:check

      - name: Diagnose frontend formatting
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' }}
        run: |
          npm run check:fix
          git diff -- resources/js/pages/workspaces/index.tsx
          exit 1

      - name: Check frontend lint
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' }}
        run: npm run check

      - name: Generate Wayfinder TypeScript definitions
        if: ${{ !cancelled() && steps.php-deps.outcome == 'success' && steps.frontend-deps.outcome == 'success' }}
        run: php artisan wayfinder:generate --with-form

      - name: Check TypeScript
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' && steps.php-deps.outcome == 'success' }}
        run: npm run types:check

      - name: Check PHP static analysis
        if: ${{ !cancelled() && steps.php-deps.outcome == 'success' }}
        run: composer types:check

  unit-tests:
    name: Unit and feature tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      # Feature tests render Blade/Inertia views that use Laravel's @vite directive.
      # Each GitHub Actions job has an isolated runner, so build assets in this job.
      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test --display-warnings
