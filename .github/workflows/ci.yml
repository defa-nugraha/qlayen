name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Laravel 13 and the committed lock file require PHP 8.4.1+.
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        id: php-deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        id: frontend-deps
        run: npm ci

      # Run every quality gate even if another check fails, so one CI run
      # reveals all current issues instead of hiding them behind the first failure.
      - name: Check PHP formatting
        if: ${{ !cancelled() && steps.php-deps.outcome == 'success' }}
        run: composer lint:fix && cat database/migrations/2026_10_19_030000_add_workspace_id_to_customer_data.php

      - name: Check frontend lint
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' }}
        run: npm run check:fix && cat resources/js/pages/customers/index.tsx && cat resources/js/pages/capture/index.tsx

      - name: Generate Wayfinder TypeScript definitions
        if: ${{ !cancelled() && steps.php-deps.outcome == 'success' && steps.frontend-deps.outcome == 'success' }}
        run: php artisan wayfinder:generate --with-form

      - name: Check TypeScript
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' && steps.php-deps.outcome == 'success' }}
        run: npm run types:check

      - name: Check PHP static analysis
        if: ${{ !cancelled() && steps.php-deps.outcome == 'success' }}
        run: composer types:check

  unit-tests:
    name: Unit and feature tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      # Feature tests render Blade/Inertia views that use Laravel's @vite directive.
      # Each GitHub Actions job has an isolated runner, so build assets in this job.
      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test
